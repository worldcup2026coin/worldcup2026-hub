name: External World Cup Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "core"
        type: choice
        options:
          - core
          - news
          - predictions
  schedule:
    # Every 6 hours. GitHub schedules use UTC.
    - cron: "17 */6 * * *"

concurrency:
  group: external-world-cup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SITE_URL: https://www.worldcup2026coin.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Check secret exists
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing. Add it in GitHub repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Decide endpoints
        id: endpoints
        run: |
          MODE="${{ github.event.inputs.mode || 'core' }}"

          if [ "$MODE" = "news" ]; then
            echo "list=/api/cron/news-sync" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "predictions" ]; then
            echo "list=/api/cron/generate-prediction-windows /api/cron/settle-predictions" >> "$GITHUB_OUTPUT"
          else
            echo "list=/api/cron/fixtures-sync /api/cron/standings-sync /api/cron/top-stats-sync /api/cron/settle-predictions /api/cron/news-sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Call protected cron endpoints
        run: |
          set -u

          failures=0
          failed_endpoints=""

          for endpoint in ${{ steps.endpoints.outputs.list }}; do
            url="$SITE_URL$endpoint"
            echo ""
            echo "========================================="
            echo "Calling $url"
            echo "========================================="

            set +e
            http_code=$(curl -sS --max-time 240 -o response.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$url")
            curl_exit=$?
            set -e

            echo "curl exit: $curl_exit"
            echo "HTTP $http_code"

            if [ -f response.json ]; then
              cat response.json
              echo ""
            else
              echo "No response body captured."
            fi

            if [ "$curl_exit" -ne 0 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "FAILED: $endpoint"
              failures=$((failures + 1))
              failed_endpoints="$failed_endpoints $endpoint"
            else
              echo "SUCCESS: $endpoint"
            fi
          done

          echo ""
          echo "========================================="
          echo "Sync summary"
          echo "========================================="

          if [ "$failures" -gt 0 ]; then
            echo "$failures endpoint(s) failed:$failed_endpoints"
            exit 1
          fi

          echo "All endpoints completed successfully."
